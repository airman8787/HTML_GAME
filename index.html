<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09181b">
<title>潮目 / TIDELINE</title>
<style>
:root {
  color-scheme: dark;
  --ink: #e4f8ef;
  --muted: #a0beb8;
  --mint: #82f2c2;
  --line: #294746;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100dvh; display: grid; place-items: center;
  background: radial-gradient(ellipse at 50% 15%, #1b3736, #091518 70%);
  color: var(--ink);
}
main { width: min(94vw, 520px, calc(72dvh * .7222)); margin: 12px auto; }
header, footer, .hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
header { margin-bottom: 9px; }
h1 { font-size: clamp(16px, 4vw, 25px); margin: 0; letter-spacing: .09em; }
h1 span { color: var(--muted); font-size: .52em; letter-spacing: .18em; }
button {
  font: inherit; cursor: pointer; border: 1px solid var(--line); border-radius: 4px;
  padding: 6px 10px; background: #142a2b; color: var(--ink); touch-action: manipulation;
}
button:disabled { opacity: .45; cursor: default; }
button:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
.hud {
  font-size: clamp(10px, 2.6vw, 13px); padding: 8px 10px; color: var(--muted);
  border: 1px solid var(--line); background: #102124; border-radius: 5px 5px 0 0;
}
.hud b { color: var(--ink); }
.field { position: relative; border: 1px solid var(--line); border-top: 0; background: #0a2026; }
canvas { display: block; width: 100%; aspect-ratio: 13 / 18; touch-action: none; }
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center;
  padding: 14px; background: #05161960; text-align: center;
}
.overlay[hidden], [hidden] { display: none !important; }
.card {
  width: min(100%, 310px); padding: clamp(12px, 4vw, 25px);
  background: #102326f5; border: 1px solid #49746c; border-radius: 8px;
  box-shadow: 0 16px 50px #0006;
}
h2 { margin: 0; font-size: clamp(19px, 5.8vw, 36px); }
.card p { color: var(--muted); font-size: 12px; line-height: 1.65; margin: 9px 0 16px; }
#action { width: 100%; font-weight: bold; background: var(--mint); color: #0a2322; padding: 9px; }
.boss { position: absolute; inset: 8px 12px auto; pointer-events: none; font-size: 10px; color: #ffd5b9; }
progress { width: 100%; height: 5px; accent-color: #ffb889; display: block; margin-top: 3px; }
footer { margin-top: 8px; font-size: 11px; line-height: 1.5; color: var(--muted); }
#touch-help { display: none; }
@media (pointer: coarse) {
  #key-help { display: none; }
  #touch-help { display: inline; }
}
@media (max-height: 530px) and (orientation: landscape) {
  main { width: min(48vw, calc(70dvh * .7222)); }
  .card p { margin: 3px 0 7px; font-size: 10px; }
  .card { padding: 7px; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>潮目 <span>TIDELINE</span></h1>
    <button id="pause" type="button" disabled aria-keyshortcuts="Escape P">一時停止</button>
  </header>
  <div class="hud">
    <span>SCORE <b id="score">000000</b></span>
    <span>LIFE <b id="life">3</b></span>
    <span>火力 <b id="power">1</b></span>
    <span>GRAZE <b id="graze">0</b></span>
  </div>
  <div class="field">
    <canvas id="game" width="520" height="720" aria-label="縦スクロールシューティングのプレイ画面"></canvas>
    <div id="boss" class="boss" hidden><b id="boss-name">ボス</b> <progress id="boss-hp" aria-label="ボスの耐久力" value="1" max="1"></progress></div>
    <section id="overlay" class="overlay" aria-labelledby="heading">
      <div class="card">
        <h2 id="heading">潮目</h2>
        <p id="description">浮島の水路を越え、月蝕の灯台へ。金色の P を集めると援護機が増える。</p>
        <button id="action" type="button">出撃</button>
      </div>
    </section>
  </div>
  <footer>
    <span id="key-help">矢印 / WASD 移動 · Z / Space 射撃 · Shift 低速</span>
    <span id="touch-help">ドラッグで移動 · 射撃は自動</span>
  </footer>
</main>
<script>
'use strict';

const canvas = document.querySelector('#game');
const ctx = canvas.getContext('2d');
const width = 520;
const height = 720;
const tau = Math.PI * 2;
const scoreLabel = document.querySelector('#score');
const lifeLabel = document.querySelector('#life');
const grazeLabel = document.querySelector('#graze');
const bossPanel = document.querySelector('#boss');
const bossHP = document.querySelector('#boss-hp');
const overlay = document.querySelector('#overlay');
const heading = document.querySelector('#heading');
const description = document.querySelector('#description');
const action = document.querySelector('#action');
const pause = document.querySelector('#pause');

const keys = new Set();
const movement = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyW', 'KeyA', 'KeyS', 'KeyD']);
const firing = new Set(['KeyZ', 'Space']);
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const stars = Array.from({ length: 94 }, (_, i) => ({
  x: (i * 197.83) % width,
  y: (i * 109.31) % height,
  speed: 24 + (i % 5) * 16,
  size: i % 11 === 0 ? 2 : 1
}));
const sky = ctx.createLinearGradient(0, 0, 0, height);
sky.addColorStop(0, '#0b242c');
sky.addColorStop(.64, '#112c34');
sky.addColorStop(1, '#091a22');

let mode = 'title';
let player, enemies, bullets, shots, sparks;
let score, graze, age, nextWave, nextShot;
let stage, routeTime, drops, power, warning, scenery;
const spells = [
  ['潮笛の渡守・澪', '水鏡の六重奏'],
  ['月蝕の灯守・燈花', '薄明の星時計'],
  ['月蝕の灯守・燈花', '終奏・逆巻く月輪']
];
const forms = {
  pearl: { radius: 4, color: '#ff9ec3' },
  seed: { radius: 3, color: '#a5bcff' },
  star: { radius: 6, color: '#ffd47c' },
  moon: { radius: 10, color: '#fb8fb0' }
};
let scrollTime = 0;
let pointer = null;
let touchMode = false;

function reset() {
  player = { x: width / 2, y: height - 88, radius: 4, life: 3, invincible: 0 };
  enemies = [];
  bullets = [];
  shots = [];
  sparks = [];
  score = graze = age = nextWave = nextShot = 0;
  stage = 'approach';
  routeTime = scenery = power = 0;
  warning = null;
  drops = [];
  scrollTime = 0;
  bossPanel.hidden = true;
  keys.clear();
  pointer = null;
  touchMode = matchMedia('(pointer: coarse)').matches;
  updateHUD();
}

function updateHUD() {
  scoreLabel.textContent = String(score).padStart(6, '0');
  lifeLabel.textContent = player.life;
  grazeLabel.textContent = graze;
  document.querySelector('#power').textContent = String(power + 1);
}

function setMode(next) {
  mode = next;
  overlay.hidden = mode === 'playing';
  pause.disabled = mode !== 'playing' && mode !== 'paused';
  pause.textContent = mode === 'paused' ? '再開' : '一時停止';
  keys.clear();
  pointer = null;
  if (mode === 'playing' && document.activeElement instanceof HTMLButtonElement) document.activeElement.blur();

  const messages = {
    paused: ['一時停止', 'ここから再開できます。', '再開'],
    clear: ['ステージクリア', 'スコア ' + score + ' · グレイズ ' + graze, 'もう一度'],
    over: ['ゲームオーバー', 'スコア ' + score + ' · グレイズ ' + graze, 'もう一度']
  };
  if (messages[mode]) {
    [heading.textContent, description.textContent, action.textContent] = messages[mode];
    action.focus();
  }
}

function togglePause() {
  if (mode === 'playing') setMode('paused');
  else if (mode === 'paused') setMode('playing');
}

action.addEventListener('click', () => {
  if (mode !== 'paused') reset();
  setMode('playing');
});
pause.addEventListener('click', togglePause);

document.addEventListener('keydown', event => {
  if (event.code === 'Escape' || event.code === 'KeyP') {
    if (!event.repeat) togglePause();
    return;
  }
  if (mode !== 'playing') return;
  if (event.target instanceof HTMLButtonElement && event.code === 'Space') return;
  if (!movement.has(event.code) && !firing.has(event.code) && !event.code.startsWith('Shift')) return;
  event.preventDefault();
  keys.add(event.code);
});
document.addEventListener('keyup', event => keys.delete(event.code));
window.addEventListener('blur', () => {
  if (mode === 'playing') setMode('paused');
});

canvas.addEventListener('pointerdown', event => {
  if (mode !== 'playing' || pointer) return;
  event.preventDefault();
  touchMode = true;
  canvas.setPointerCapture(event.pointerId);
  pointer = { id: event.pointerId, x: event.clientX, y: event.clientY };
});
canvas.addEventListener('pointermove', event => {
  if (pointer?.id !== event.pointerId) return;
  const rect = canvas.getBoundingClientRect();
  player.x = clamp(player.x + (event.clientX - pointer.x) * width / rect.width, 16, width - 16);
  player.y = clamp(player.y + (event.clientY - pointer.y) * height / rect.height, 25, height - 20);
  pointer.x = event.clientX;
  pointer.y = event.clientY;
});
for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  canvas.addEventListener(type, event => {
    if (pointer?.id === event.pointerId) pointer = null;
  });
}

function emit(enemy, angle, speed, form, turn = 0) {
  bullets.push({ x: enemy.x, y: enemy.y + 13, angle, speed, form, turn, grazed: false });
}

function ring(enemy, count, offset, speed, form, turn = 0) {
  for (let i = 0; i < count; i++) emit(enemy, offset + i * tau / count, speed, form, turn);
}

function volley(enemy) {
  const aim = Math.atan2(player.y - enemy.y - 13, player.x - enemy.x);
  const n = enemy.volley++;
  if (enemy.kind === 'mid') {
    ring(enemy, 12, n * .18, 106, 'pearl', .11);
    if (n % 2 === 0) ring(enemy, 6, aim, 145, 'star');
    enemy.cooldown = .56;
  } else if (enemy.kind === 'boss') {
    const fierce = enemy.phase === 2;
    ring(enemy, fierce ? 18 : 14, n * .21, fierce ? 135 : 110, 'seed', .16);
    if (fierce) ring(enemy, 12, -n * .18, 108, 'pearl', -.18);
    if (n % 3 === 0) {
      for (let i = -2; i <= 2; i++) emit(enemy, aim + i * .19, 152, 'moon');
    }
    if (fierce && n % 4 === 2) ring(enemy, 7, aim, 175, 'star');
    enemy.cooldown = fierce ? .43 : .65;
  } else {
    const wide = enemy.kind === 'spinner';
    for (let i = wide ? -2 : -1; i <= (wide ? 2 : 1); i++) {
      emit(enemy, aim + i * .24, wide ? 155 : 128, wide ? 'seed' : 'pearl');
    }
    enemy.cooldown = wide ? 1.6 : 1.9;
  }
}

function spawnWave(index) {
  const spinner = index % 3 === 2;
  const side = index % 2 === 0 ? -1 : 1;
  for (let i = 0; i < 3; i++) {
    const x = 118 + 142 * i + 30 * side;
    enemies.push({
      kind: spinner ? 'spinner' : 'scout', x, baseX: x, y: -28 - 52 * i, side,
      radius: spinner ? 18 : 14, hp: spinner ? 5 : 3,
      cooldown: .95 + i * .18, age: 0, volley: 0
    });
  }
}

function announce(enemy, spell) {
  warning = { spell, left: 1.9 };
  bullets = [];
  shots = [];
  enemy.cooldown = .25;
  enemy.volley = 0;
  document.querySelector('#boss-name').textContent = spells[spell].join(' ／ ');
}

function spawnBoss(final) {
  stage = final ? 'final' : 'crossing';
  const hp = final ? 540 : 160;
  const enemy = {
    kind: final ? 'boss' : 'mid', x: width / 2, y: 114, radius: final ? 34 : 28,
    hp, maxHP: hp, volley: 0, age: 0, phase: 1
  };
  enemies = [enemy];
  bossPanel.hidden = false;
  bossHP.value = 1;
  announce(enemy, final ? 1 : 0);
}

function burst(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = i * tau / count + Math.random() * .4;
    const speed = 34 + Math.random() * 145;
    sparks.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, time: .5, color });
  }
}

function updatePlayer(dt) {
  const dx = Number(keys.has('ArrowRight') || keys.has('KeyD')) - Number(keys.has('ArrowLeft') || keys.has('KeyA'));
  const dy = Number(keys.has('ArrowDown') || keys.has('KeyS')) - Number(keys.has('ArrowUp') || keys.has('KeyW'));
  const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 145 : 325) * dt / (Math.hypot(dx, dy) || 1);
  player.x = clamp(player.x + dx * speed, 16, width - 16);
  player.y = clamp(player.y + dy * speed, 25, height - 20);
  player.invincible = Math.max(0, player.invincible - dt);

  if ((touchMode || keys.has('KeyZ') || keys.has('Space')) && age >= nextShot) {
    for (const offset of [-10, 10]) shots.push({ x: player.x + offset, y: player.y - 15 });
    for (let i = 1; i <= power; i++) {
      for (const side of [-1, 1]) shots.push({ x: player.x + side * (14 + i * 5), y: player.y, vx: side * i * 36 });
    }
    nextShot = age + .13;
  }
}

function updateEnemies(dt) {
  for (const enemy of enemies) {
    enemy.age += dt;
    if (enemy.kind === 'boss' || enemy.kind === 'mid') {
      enemy.y = Math.min(133, enemy.y + 106 * dt);
      enemy.x = width / 2 + Math.sin(Math.max(0, enemy.age - 1.9) * .75) * 96;
    } else {
      enemy.y += (enemy.kind === 'spinner' ? 66 : 87) * dt;
      enemy.x = enemy.baseX + Math.sin(enemy.age * 1.72) * 46 * enemy.side;
    }
    if (enemy.y > 20) {
      enemy.cooldown -= dt;
      if (enemy.cooldown <= 0) volley(enemy);
    }
  }
}

function updateShots(dt) {
  for (const shot of shots) {
    shot.x += (shot.vx || 0) * dt;
    shot.y -= 660 * dt;
    const enemy = enemies.find(ship =>
      ship.hp > 0 && Math.hypot(ship.x - shot.x, ship.y - shot.y) < ship.radius + 5
    );
    if (!enemy) continue;
    enemy.hp--;
    shot.y = -30;
    if (enemy.kind === 'boss' || enemy.kind === 'mid') bossHP.value = enemy.hp / enemy.maxHP;
    if (enemy.kind === 'boss' && enemy.phase === 1 && enemy.hp <= enemy.maxHP / 2) {
      enemy.phase = 2;
      announce(enemy, 2);
      break;
    }
    if (enemy.hp > 0) continue;

    const final = enemy.kind === 'boss';
    if (enemy.kind === 'mid') {
      stage = 'beacon';
      routeTime = nextWave = 0;
      bullets = [];
      bossPanel.hidden = true;
    }
    if (!final) drops.push({ x: enemy.x, y: enemy.y });
    score += final ? 5000 : 300;
    burst(enemy.x, enemy.y, final ? '#ffe4a4' : '#91f3cf', final ? 46 : 13);
    updateHUD();
    if (final) {
      bossPanel.hidden = true;
      bullets = [];
      setMode('clear');
      break;
    }
  }
  shots = shots.filter(shot => shot.y > -20);
  enemies = enemies.filter(enemy => enemy.hp > 0 && enemy.y < height + 35);
}

function updateHazards(dt) {
  for (const bullet of bullets) {
    bullet.angle += bullet.turn * dt;
    bullet.x += Math.cos(bullet.angle) * bullet.speed * dt;
    bullet.y += Math.sin(bullet.angle) * bullet.speed * dt;
    const radius = forms[bullet.form].radius;
    const distance = Math.hypot(bullet.x - player.x, bullet.y - player.y);
    if (player.invincible > 0) continue;
    if (distance < player.radius + radius) {
      takeHit();
      break;
    }
    if (distance < radius + 18 && !bullet.grazed) {
      bullet.grazed = true;
      graze++;
      score += 15;
      updateHUD();
    }
  }
  if (player.invincible <= 0 && enemies.some(enemy =>
    Math.hypot(enemy.x - player.x, enemy.y - player.y) < enemy.radius + player.radius
  )) takeHit();
  bullets = bullets.filter(bullet =>
    bullet.x > -16 && bullet.x < width + 16 && bullet.y > -16 && bullet.y < height + 16
  );
}

function takeHit() {
  player.life--;
  player.invincible = 1.65;
  bullets = bullets.filter(bullet => Math.hypot(bullet.x - player.x, bullet.y - player.y) > 125);
  burst(player.x, player.y, '#ffd5a3', 25);
  updateHUD();
  if (player.life === 0) setMode('over');
}

function update(dt) {
  age += dt;
  if (warning) {
    warning.left -= dt;
    if (warning.left <= 0) warning = null;
    return;
  }
  if (stage === 'approach' || stage === 'beacon') {
    routeTime += dt;
    scenery += dt;
    const waves = stage === 'approach' ? 4 : 5;
    if (nextWave < waves && routeTime >= 1 + nextWave * 3) {
      spawnWave(nextWave + (stage === 'beacon' ? 4 : 0));
      nextWave++;
    }
    if (routeTime >= waves * 3 + 5) {
      spawnBoss(stage === 'beacon');
      return;
    }
  }
  for (const item of drops) {
    item.y += 89 * dt;
    const dx = player.x - item.x, dy = player.y - item.y;
    const distance = Math.hypot(dx, dy);
    if (distance < 72) {
      item.x += dx * 8 * dt;
      item.y += dy * 8 * dt;
    }
    if (distance < 18) {
      power = Math.min(3, power + 1);
      score += 80;
      burst(item.x, item.y, '#ffe681', 8);
      item.y = height + 40;
      updateHUD();
    }
  }
  drops = drops.filter(item => item.y < height + 24);
  updatePlayer(dt);
  updateEnemies(dt);
  updateShots(dt);
  if (mode === 'playing') updateHazards(dt);
}

function drawBackground() {
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = '#8cdacb';
  for (const star of stars) {
    const y = (star.y + scrollTime * star.speed) % height;
    ctx.globalAlpha = star.size === 2 ? .49 : .25;
    ctx.fillRect(star.x, y, star.size, star.size * 3);
  }
  ctx.globalAlpha = 1;
  const advance = 90 + scenery * 55 + scrollTime * 4;
  ctx.save();
  ctx.globalAlpha = .75;
  for (let i = Math.floor(advance / 224) - 1; i <= Math.floor(advance / 224) + 4; i++) {
    const y = advance - i * 224 + 480;
    const side = i % 2 === 0 ? 1 : -1;
    ctx.save();
    ctx.translate(side > 0 ? 14 : width - 14, y);
    ctx.scale(side, 1);
    polygon([[-40,-92],[38,-85],[83,-47],[126,12],[91,60],[24,99],[-45,86]], '#163b45');
    polygon([[-38,-105],[37,-99],[86,-53],[124,-1],[85,44],[21,80],[-42,68]], '#346361');
    polygon([[-30,-91],[30,-87],[71,-46],[101,-3],[67,27],[19,62],[-32,51]], '#284c4e');
    for (let j = 0; j < 6; j++) {
      const x = 5 + (j * 23) % 67, yy = -37 + (j * 29) % 77;
      polygon([[x-9,yy+6],[x,yy-19],[x+9,yy+6]], '#102f39');
      polygon([[x-6,yy],[x,yy-23],[x+5,yy]], '#48716b');
    }
    if (i % 3 === 0) {
      ctx.fillStyle = '#c59a78';
      ctx.fillRect(32,-50,7,44); ctx.fillRect(62,-50,7,44);
      polygon([[22,-59],[50,-54],[80,-59],[76,-47],[25,-47]], '#c19b81');
      ctx.fillRect(29,-39,44,4);
    } else if (stage === 'beacon' || stage === 'final') {
      polygon([[37,5],[42,-47],[55,-47],[61,5]], '#aa9c91');
      ctx.fillStyle = '#ffd580'; ctx.fillRect(42,-54,13,9);
      polygon([[36,-54],[49,-67],[62,-54]], '#434961');
    }
    ctx.restore();
  }
  ctx.restore();
}

function polygon(points, fill) {
  ctx.beginPath();
  points.forEach(([x,y], i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}

function oval(x, y, rx, ry, fill, rotation = 0) {
  ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rotation,0,tau);
  ctx.fillStyle = fill; ctx.fill();
}

// Shared character artwork keeps each portrait recognizable on the field.
function guardian(x, y, scale, final) {
  const hair = final ? '#563248' : '#254b68';
  const silk = final ? '#de785f' : '#5fbebc';
  const light = final ? '#ffe1a3' : '#b8f4e1';
  ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
  oval(0,-11,23,26,hair);
  for (const sign of [-1,1]) {
    ctx.save(); ctx.scale(sign,1);
    polygon([[12,-24],[26,-15],[22,0],[39,18],[27,22],[13,9]],hair);
    polygon([[12,1],[27,3],[44,28],[31,32],[17,19]],silk);
    polygon([[28,12],[36,18],[43,27],[34,29]],light);
    ctx.restore();
  }
  polygon([[-11,0],[10,0],[16,19],[29,41],[6,37],[-7,42],[-26,37],[-15,18]],silk);
  polygon([[-12,0],[0,7],[12,-1],[7,13],[-1,19]],light);
  polygon([[-13,16],[14,14],[16,21],[-15,24]],hair);
  oval(0,-13,15,17,'#f8ceb3');
  polygon([[-19,-15],[-17,-31],[0,-38],[18,-28],[16,-11],[8,-25],[-2,-16],[0,-25],[-13,-12]],hair);
  for (const eye of [-6,7]) {
    oval(eye,-13,2.5,2.1,hair); oval(eye+.5,-13.7,.8,.8,'#fff8dd');
  }
  if (final) {
    polygon([[-18,-28],[-24,-44],[-9,-34],[-2,-47],[4,-33],[21,-42],[15,-27]],'#e7b96e');
    oval(1,-33,4,5,'#ff897a');
    oval(19,-17,5,9,'#f2b86f');
  } else {
    polygon([[-19,-24],[-35,-37],[-22,-36],[-12,-29]],light);
    polygon([[-18,-26],[-25,-47],[-16,-40],[-11,-28]],silk);
    polygon([[-26,14],[32,0],[33,3],[-26,18]],'#e7c87f');
  }
  ctx.restore();
}

function showSpell() {
  const {spell,left} = warning;
  const final = spell > 0;
  const slide = Math.min(1,(1.9-left)/.24);
  ctx.save();
  ctx.translate((1-slide)*width,0);
  polygon([[0,235],[520,193],[520,384],[0,426]],final ? '#35213cf2' : '#163647f2');
  polygon([[0,235],[520,193],[520,198],[0,240]],final ? '#eab072' : '#77dfcc');
  guardian(103,307,2.25,final);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#e6d4ad'; ctx.font = '18px serif';
  ctx.fillText(spells[spell][0],210,273);
  ctx.fillStyle = '#fff5dc'; ctx.font = 'bold 31px serif';
  ctx.fillText(spells[spell][1],208,326,296);
  ctx.restore();
}

function drawShip(x, y, scale, angle, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);
  ctx.fillStyle = '#12282f';
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(0, -22);
  ctx.lineTo(8, -7);
  ctx.lineTo(19, 11);
  ctx.lineTo(9, 8);
  ctx.lineTo(0, 15);
  ctx.lineTo(-9, 8);
  ctx.lineTo(-19, 11);
  ctx.lineTo(-8, -7);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.fillRect(-1.5, -8, 3, 10);
  for (const side of [-1,1]) {
    polygon([[side*4,-3],[side*16,9],[side*7,6]],color);
    polygon([[side*6,9],[side*10,13],[side*6,21]],'#68b5dd');
  }
  oval(0,-7,3,6,'#e8effa');
  ctx.restore();
}

function draw() {
  drawBackground();
  for (const shot of shots) {
    ctx.fillStyle = '#8bf8d1';
    ctx.fillRect(shot.x - 2, shot.y - 10, 4, 18);
  }
  for (const enemy of enemies) {
    if (enemy.kind === 'boss' || enemy.kind === 'mid') {
      ctx.strokeStyle = '#f8ce8780';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(enemy.x,enemy.y,49,36,enemy.age*.5,0,tau); ctx.stroke();
      guardian(enemy.x,enemy.y,enemy.kind === 'boss' ? 1.05 : .78,enemy.kind === 'boss');
    } else if (enemy.kind === 'spinner') {
      ctx.save(); ctx.translate(enemy.x,enemy.y); ctx.rotate(enemy.age*2);
      for (let i=0;i<4;i++) {
        ctx.rotate(Math.PI/2);
        polygon([[0,-3],[4,-23],[13,-14],[9,-4]],'#bb91bf');
      }
      oval(0,0,7,7,'#ffcf98'); ctx.restore();
    } else drawShip(enemy.x,enemy.y,.95,Math.PI,'#efa780');
  }
  for (const item of drops) {
    polygon([[item.x,item.y-12],[item.x+12,item.y],[item.x,item.y+12],[item.x-12,item.y]],'#ffd877');
    ctx.fillStyle='#39283a'; ctx.font='bold 13px monospace'; ctx.textAlign='center';
    ctx.fillText('P',item.x,item.y+4); ctx.textAlign='start';
  }
  for (const bullet of bullets) {
    const {radius,color} = forms[bullet.form];
    if (bullet.form === 'seed') oval(bullet.x,bullet.y,7,3,color,bullet.angle);
    else if (bullet.form === 'star') {
      const points = [];
      for (let i=0;i<10;i++) {
        const angle=i*tau/10+age, r=i%2 ? 4 : 8;
        points.push([bullet.x+Math.cos(angle)*r,bullet.y+Math.sin(angle)*r]);
      }
      polygon(points,color);
    } else oval(bullet.x,bullet.y,radius+1,radius+1,color);
    oval(bullet.x,bullet.y,radius*.52,radius*.52,'#fff5e0');
  }
  if (player.life > 0 && (player.invincible <= 0 || Math.floor(player.invincible * 13) % 2 === 0)) {
    for (let i=1;i<=power;i++) {
      for (const side of [-1,1]) {
        const x=player.x+side*(14+i*5);
        oval(x,player.y+i*4,3,5,'#9efbda');
      }
    }
    drawShip(player.x, player.y, 1, 0, '#83f8d1');
    ctx.fillStyle = '#f5fff8';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, tau);
    ctx.fill();
  }
  for (const spark of sparks) {
    ctx.globalAlpha = spark.time * 2;
    ctx.fillStyle = spark.color;
    ctx.fillRect(spark.x, spark.y, 3, 3);
  }
  ctx.globalAlpha = 1;
  if (warning) showSpell();
}

let previous = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - previous) / 1000);
  previous = now;
  if (mode !== 'paused') {
    scrollTime += dt;
    for (const spark of sparks) {
      spark.x += spark.vx * dt;
      spark.y += spark.vy * dt;
      spark.time -= dt;
    }
    sparks = sparks.filter(spark => spark.time > 0);
  }
  if (mode === 'playing') update(dt);
  draw();
  requestAnimationFrame(frame);
}

reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
