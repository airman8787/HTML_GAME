<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09181b">
<title>潮目 / TIDELINE</title>
<style>
:root {
  color-scheme: dark;
  --ink: #e4f8ef;
  --muted: #a0beb8;
  --mint: #82f2c2;
  --line: #294746;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100dvh; display: grid; place-items: center;
  background: radial-gradient(ellipse at 50% 15%, #1b3736, #091518 70%);
  color: var(--ink);
}
main { width: min(94vw, 520px, calc(72dvh * .7222)); margin: 12px auto; }
header, footer, .hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
header { margin-bottom: 9px; }
h1 { font-size: clamp(16px, 4vw, 25px); margin: 0; letter-spacing: .09em; }
h1 span { color: var(--muted); font-size: .52em; letter-spacing: .18em; }
button {
  font: inherit; cursor: pointer; border: 1px solid var(--line); border-radius: 4px;
  padding: 6px 10px; background: #142a2b; color: var(--ink); touch-action: manipulation;
}
button:disabled { opacity: .45; cursor: default; }
button:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
.hud {
  font-size: clamp(10px, 2.6vw, 13px); padding: 8px 10px; color: var(--muted);
  border: 1px solid var(--line); background: #102124; border-radius: 5px 5px 0 0;
}
.hud b { color: var(--ink); }
.field { position: relative; border: 1px solid var(--line); border-top: 0; background: #0a2026; }
canvas { display: block; width: 100%; aspect-ratio: 13 / 18; touch-action: none; }
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center;
  padding: 14px; background: #05161960; text-align: center;
}
.overlay[hidden], [hidden] { display: none !important; }
.card {
  width: min(100%, 310px); padding: clamp(12px, 4vw, 25px);
  background: #102326f5; border: 1px solid #49746c; border-radius: 8px;
  box-shadow: 0 16px 50px #0006;
}
h2 { margin: 0; font-size: clamp(19px, 5.8vw, 36px); }
.card p { color: var(--muted); font-size: 12px; line-height: 1.65; margin: 9px 0 16px; }
#action { width: 100%; font-weight: bold; background: var(--mint); color: #0a2322; padding: 9px; }
.boss { position: absolute; inset: 8px 12px auto; pointer-events: none; font-size: 10px; color: #ffd5b9; }
.boss { padding: 6px 9px; background: #111323dc; border-radius: 4px; }
#meter-label { float: right; }
progress { width: 100%; height: 10px; accent-color: #ffb889; display: block; margin-top: 3px; }
footer { margin-top: 8px; font-size: 11px; line-height: 1.5; color: var(--muted); }
#touch-help { display: none; }
@media (pointer: coarse) {
  #key-help { display: none; }
  #touch-help { display: inline; }
}
@media (max-height: 530px) and (orientation: landscape) {
  main { width: min(48vw, calc(70dvh * .7222)); }
  .card p { margin: 3px 0 7px; font-size: 10px; }
  .card { padding: 7px; }
}
#title-portrait { display: block; height: clamp(65px, 14vh, 124px); width: auto; margin: -5px auto 8px; image-rendering: pixelated; }
body { background: radial-gradient(ellipse at 50% 20%, #29223b, #0b0e1b 72%); }
.card { background: linear-gradient(145deg,#202035f5,#101523f5); border-color: #746985; }
#rank-label { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 12px; font-size:13px; }
#rank { font:inherit; flex:1; padding:5px; background:#222536; color:#fff; border:1px solid #73687c; border-radius:4px; }
@media (max-height:650px) { #title-portrait { max-height:48px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>潮目 <span>TIDELINE</span></h1>
    <button id="music" type="button" aria-pressed="true" aria-label="BGM切替">BGM ♪</button>
    <button id="pause" type="button" disabled aria-keyshortcuts="Escape P">一時停止</button>
  </header>
  <div id="chapter-name" class="hud"></div>
  <div class="hud">
    <span>SCORE <b id="score">000000</b></span>
    <span>LIFE <b id="life">3</b></span>
    <span>火力 <b id="power">1</b></span>
    <span>GRAZE <b id="graze">0</b></span>
  </div>
  <div class="field">
    <canvas id="game" width="520" height="720" aria-label="縦スクロールシューティングのプレイ画面"></canvas>
    <div id="boss" class="boss" hidden><b id="boss-name">ボス</b> <b id="meter-label"></b><progress id="boss-hp" aria-label="ボスの耐久力" value="1" max="1"></progress></div>
    <section id="overlay" class="overlay" aria-labelledby="heading">
      <div class="card">
        <h2 id="heading">潮目</h2>
        <p id="description">月うさぎと夜の参道へ。翡翠の星で火力アップ。月貨は500点。25,000点ごとにボムを1個補充。</p>
        <label id="rank-label">難易度 <select id="rank">
          <option value="0">初級</option><option value="1" selected>標準</option>
          <option value="2">上級</option><option value="3">極夜</option>
        </select></label>
        <button id="action" type="button">出撃</button>
      </div>
    </section>
  </div>
  <footer>
    <button type="button" id="bomb" disabled>ボム 2</button>
    <span id="key-help">矢印 / WASD 移動 · Z / Space 射撃 · Shift 低速 · X ボム</span>
    <span id="touch-help">ドラッグで移動 · 射撃は自動</span>
  </footer>
</main>

  }));

  portrait.alt = '';

  action.disabled = false;
}

let audio, master, echo, noise, musicTimer, nextBeat, step = 0;
const chords = [[62,65,69,76],[58,62,65,69],[65,69,72,76],[60,64,67,74],
                [62,65,69,72],[55,58,62,69],[57,61,64,67],[57,61,64,70]];
const arp = [0,2,1,3,2,1,3,2];
const midiHz = note => 440 * 2 ** ((note - 69) / 12);

function instrument(time, duration, frequency, voice, volume, attack = .008, endFrequency) {
  const tone = audio.createOscillator(), gain = audio.createGain();
  tone.type = voice;
  tone.frequency.setValueAtTime(frequency, time);
  if (endFrequency) tone.frequency.exponentialRampToValueAtTime(endFrequency, time + duration);
  gain.gain.setValueAtTime(.0001, time);
  gain.gain.exponentialRampToValueAtTime(volume, time + attack);
  gain.gain.exponentialRampToValueAtTime(.0001, time + duration);
  tone.connect(gain).connect(master);
  if (voice === 'triangle') gain.connect(echo);
  tone.start(time); tone.stop(time + duration);
}

function percussion(time, snare) {
  const source = audio.createBufferSource(), filter = audio.createBiquadFilter(), gain = audio.createGain();
  source.buffer = noise;
  filter.type = 'highpass'; filter.frequency.value = snare ? 1600 : 7000;
  const length = snare ? .14 : .055;
  gain.gain.setValueAtTime(snare ? .17 : .075, time);
  gain.gain.exponentialRampToValueAtTime(.0001, time + length);
  source.connect(filter).connect(gain).connect(master);
  source.start(time); source.stop(time + length);
}

// Wide, slowly opening pad and a brighter singing lead share a stereo hall return.
let hall;
function silk(time, duration, note, lead) {
  const filter = audio.createBiquadFilter();
  filter.type = 'lowpass';
  filter.Q.value = .8;
  filter.frequency.setValueAtTime(lead ? 1300 : 500, time);
  filter.frequency.exponentialRampToValueAtTime(lead ? 4800 : 2200, time + duration * .38);
  filter.frequency.exponentialRampToValueAtTime(900, time + duration);
  const envelope = audio.createGain();
  envelope.gain.setValueAtTime(.0001, time);
  envelope.gain.exponentialRampToValueAtTime(lead ? .105 : .047, time + (lead ? .035 : .22));
  envelope.gain.exponentialRampToValueAtTime(.0001, time + duration);
  filter.connect(envelope).connect(master);
  envelope.connect(hall);
  for (const side of [-1,1]) {
    const osc = audio.createOscillator(), pan = audio.createStereoPanner();
    osc.type = 'sawtooth'; osc.frequency.value = midiHz(note);
    osc.detune.value = side * (lead ? 5 : 9);
    pan.pan.value = side * .68;
    osc.connect(pan).connect(filter);
    osc.start(time); osc.stop(time + duration);
  }
}
const theme = [[81,79,77],[77,74,72],[76,79,84],[83,79,76],
               [81,84,88],[86,82,79],[85,81,76],[82,81,73]];

function sequenceMusic() {
  if (!audio || audio.state !== 'running') return;
  nextBeat = Math.max(nextBeat, audio.currentTime + .007);
  const eighth = 60 / 136 / 2;
  while (nextBeat < audio.currentTime + .11) {
    const beat = step % 8, chord = chords[Math.floor(step / 8) % chords.length];
    const boss = stage === 'crossing' || stage === 'final';
    const piano = midiHz(chord[arp[beat]] + 12);
    instrument(nextBeat, .46, piano, 'triangle', .21);
    instrument(nextBeat, .085, piano * 2, 'sine', .055);
    if (beat === 0) {
      for (const note of chord) silk(nextBeat, eighth * 8.6, note, false);
    }
    const phrase = theme[Math.floor(step / 8) % theme.length];
    if (beat === 0 || beat === 3 || beat === 6) {
      const pitch = phrase[beat / 3];
      silk(nextBeat, eighth * (beat === 6 ? 1.8 : 2.8), pitch, true);
      if (boss) instrument(nextBeat, .52, midiHz(pitch + 12), 'sine', .075, .025);
    }
    if (beat % 2 === 0) instrument(nextBeat, .18, 134, 'sine', .52, .003, 42);
    if (beat % 2 === 1) {
      instrument(nextBeat, .18, midiHz(chord[0] - 24), 'triangle', .28);
      percussion(nextBeat, false);
    }
    if (beat === 2 || beat === 6) percussion(nextBeat, true);
    if (boss) instrument(nextBeat + eighth / 2, .16, midiHz(chord[arp[(beat+3)%8]] + 12), 'triangle', .105);
    nextBeat += eighth; step++;
  }
}

function syncMusic() {
  clearInterval(musicTimer);
  if (!musicEnabled || mode !== 'playing') {
    if (audio) audio.suspend().catch(() => {});
    return;
  }
  const AudioEngine = window.AudioContext || window.webkitAudioContext;
  if (!AudioEngine) return;
  if (!audio) {
    audio = new AudioEngine();
    master = audio.createGain(); master.gain.value = .42;
    const limiter = audio.createDynamicsCompressor();
    limiter.threshold.value = -12; limiter.ratio.value = 4;
    master.connect(limiter).connect(audio.destination);
    hall = audio.createConvolver();
    const length = Math.floor(audio.sampleRate * 1.65);
    const impulse = audio.createBuffer(2, length, audio.sampleRate);
    for (let c = 0; c < 2; c++) {
      const samples = impulse.getChannelData(c);
      for (let i = 0; i < length; i++) samples[i] = (Math.random()*2-1) * (1-i/length)**3;
    }
    hall.buffer = impulse;
    const send = audio.createGain(); send.gain.value = .22;
    hall.connect(send).connect(master);
    echo = audio.createDelay(); echo.delayTime.value = 60 / 136 * .75;
    const wet = audio.createGain(); wet.gain.value = .16;
    echo.connect(wet).connect(master);
    noise = audio.createBuffer(1, Math.ceil(audio.sampleRate * .2), audio.sampleRate);
    const samples = noise.getChannelData(0);
    for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
  }
  nextBeat = audio.currentTime + .04;
  audio.resume().catch(() => {});
  musicTimer = setInterval(sequenceMusic, 30);
}

function nextDrop() {

function canBomb() {

}

function useBomb() {
  if (!canBomb()) return;
  bombs--;

  bullets = [];
  for (const enemy of [...enemies]) {
    if (enemy.hp > 0 && enemy.age >= 0 && enemy.x >= 0 && enemy.x <= width &&

function setMode(next) {

function emit(enemy, angle, speed, form, turn = 0) {
  bullets.push({ x: enemy.x, y: enemy.y + 13, angle, speed, form, turn, grazed: false });
}

function ring(enemy, count, offset, speed, form, turn = 0) {
  for (let i = 0; i < count; i++) emit(enemy, offset + i * tau / count, speed, form, turn);
}

function volley(enemy) {
  const aim = Math.atan2(player.y - enemy.y - 13, player.x - enemy.x);
  const n = enemy.volley++;
  if (chapterIndex && (enemy.kind === 'boss' || (enemy.kind === 'mid' && enemy.phase === 2))) {
    chapterVolley(enemy, aim, n);
  } else if (enemy.kind === 'mid' && enemy.phase === 1) {
    for (let i = -2-rank; i <= 2+rank; i++) emit(enemy, aim + i * .17, 135, 'pearl');
    enemy.cooldown = 1.05 - rank * .09;
  } else if (enemy.kind === 'mid') {
    ring(enemy, 9 + rank * 3, n * .18, 106, 'seal', .14);
    if (n % 2 === 0) ring(enemy, 4 + rank * 2, aim, 145, 'star');
    enemy.cooldown = .72 - .07 * rank;
  } else if (enemy.kind === 'boss') {
    const phase = enemy.phase;
    const rays = 11 + rank * 4;
    if (phase === 1) {
      ring(enemy, rays, n * .21, 122, 'seed', .17);
    } else if (phase === 2) {
      for (const side of [-1, 1]) {
        const lantern = { x: enemy.x + 50 * side, y: enemy.y };
        ring(lantern, rays - 2, side * n * .15, 112, 'pearl', side * .22);
      }
    } else if (phase === 3) {
      for (let i = 0; i < rays; i++) {
        const gap = 40 + (width - 80) * (.5 + .45 * Math.sin(n * .52));
        const x = (i + .5) * width / rays;
        if (Math.abs(x - gap) > 41) emit({ x, y: -12 }, Math.PI / 2, 145, 'star');
      }
      ring(enemy, rays - 2, n * .23, 116, 'seal', -.12);
    } else {
      ring(enemy, rays + 4, n * .19, 142, 'seed', .19);
      ring(enemy, rays - 3, -n * .17, 112, 'pearl', -.17);
    }
    if (n % 3 === 0) {
      for (let i = -rank-1; i <= rank+1; i++) emit(enemy, aim + i * .16, 159, 'moon');
    }
    enemy.cooldown = .84 - .075 * rank - .074 * phase;
  } else {
    const style = spirits[enemy.kind];
    for (let i = -rank; i <= rank; i++) {
      emit(enemy, aim + i * .23, style.speed, style.form);
    }
    enemy.cooldown = style.interval - .12 * rank;
  }
}

function chapterVolley(enemy, aim, n) {
  const mid = enemy.kind === 'mid';
  const phase = mid ? 1 : enemy.phase;
  const rays = 8 + rank * 3 + phase;
  const form = mid ? 'seal' : ['','seed','star','pearl','moon'][chapterIndex];
  switch (chapterIndex) {
    case 1: // Twin facets split apart around the stream.
      for (const side of [-1,1]) {
        ring({x:enemy.x + side*48,y:enemy.y}, rays, side*n*.17, 110+phase*6, form, side*.16);
      }
      break;
    case 2: // Rotating fans leave a corridor between their leaves.
      for (let fan=0; fan<3; fan++) {
        for (let i=0; i<4+rank+phase; i++) emit(enemy, fan*tau/3+n*.21+i*.10, 116+i*5, form, .16);
      }
      break;
    case 3: // Staggered chimes fall from above with a moving opening.
      for (let i=0; i<rays+4; i++) {
        const x=(i+.5)*width/(rays+4), gap=width/2+168*Math.sin(n*.47);
        if (Math.abs(x-gap)>45) emit({x,y:-13}, Math.PI/2+.10*Math.sin(n+i), 120+phase*7, form);
      }
      if (n%2===0) ring(enemy,rays,n*.15,110,'star');
      break;
    case 4: // Crescent satellites orbit the eclipse and counter-rotate.
      for (const side of [-1,1]) {
        const sat={x:enemy.x+side*80*Math.cos(n*.27),y:enemy.y+side*48*Math.sin(n*.27)};
        ring(sat,rays,side*n*.29,106+phase*9,mid?'seal':side>0?'moon':'seed',side*.21);
      }
      break;
  }
  if (phase >= 2 && n%2 === 0) {
    for (let i=-rank-1; i<=rank+1; i++) emit(enemy,aim+i*.17,156,'pearl');
  }
  if (phase >= 3 && n%3 === 1) ring(enemy,rays,aim,138,'star',-.12);
  enemy.cooldown = .98 - .065*rank - .08*phase;
}

function burst(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = i * tau / count + Math.random() * .4;
    const speed = 34 + Math.random() * 145;
    sparks.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, time: .5, color });

function faceMotion(dx, dy) {
  if (!dx && !dy) return;
  player.flip = dx < 0;
  player.facing = Math.abs(dx) > Math.abs(dy) ? 'east' : dy < 0 ? 'north' : 'south';
  player.lean = dx && dy ? Math.sign(dx) * .18 : 0;
}

function updatePlayer(dt) {
  const dx = Number(keys.has('ArrowRight') || keys.has('KeyD')) - Number(keys.has('ArrowLeft') || keys.has('KeyA'));
  const dy = Number(keys.has('ArrowDown') || keys.has('KeyS')) - Number(keys.has('ArrowUp') || keys.has('KeyW'));
  faceMotion(dx, dy);
  const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 145 : 325) * dt / (Math.hypot(dx, dy) || 1);
  player.x = clamp(player.x + dx * speed, 16, width - 16);
  player.y = clamp(player.y + dy * speed, 25, height - 20);
  player.invincible = Math.max(0, player.invincible - dt);

  if ((touchMode || keys.has('KeyZ') || keys.has('Space')) && age >= nextShot) {
    const damage = 1 + Math.floor(power / 4);
    for (const offset of [-10, 10]) shots.push({ x: player.x + offset, y: player.y - 15, damage });
    if (power === maxPower) shots.push({ x: player.x, y: player.y - 23, damage: 2 });
    for (let i = 1; i <= Math.ceil(power / 3); i++) {
      for (const side of [-1, 1]) shots.push({ x: player.x + side * (20 + i * 14), y: player.y + i * 4, vx: side * i * 36 });
    }
    nextShot = age + .15 - power * .005;
  }
}

function updateEnemies(dt) {
  for (const enemy of enemies) {
    if (enemy.hp <= 0) continue;
    enemy.age += dt;
    if (enemy.kind === 'boss' || enemy.kind === 'mid') {
      enemy.y = Math.min(133, enemy.y + 106 * dt);
      enemy.x = width / 2 + Math.sin(Math.max(0, enemy.age - 1.9) * .75) * 96;
    } else {
      if (enemy.age < 0) continue;
      followConvoy(enemy);
    }
    if (enemy.y > 20 && enemy.y < height - 100 && enemy.x > 0 && enemy.x < width) {
      enemy.cooldown -= dt;
      if (enemy.cooldown <= 0) volley(enemy);
    }
  }
}

function updateBossHP(enemy) {
  bossHP.value = enemy.hp;
  const clock = enemy.kind === 'mid' && enemy.phase === 2 ? ' · ' + Math.ceil(enemy.sealLeft) + '秒' : '';
  meterLabel.textContent = 'HP ' + enemy.hp + ' / ' + enemy.maxHP + clock;
}

function damageEnemy(enemy, amount) {
  if (enemy.hp <= 0) return;
  const mid = enemy.kind === 'mid', final = enemy.kind === 'boss';
  enemy.hp = Math.max(0, enemy.hp - amount);
  if (mid && enemy.phase === 1 && enemy.hp <= enemy.maxHP / 2) {
    enemy.hp = enemy.maxHP / 2;
    enemy.phase = 2;
    enemy.sealLeft = sealDuration;
    announce(enemy, 0);
  } else if (final && enemy.phase < 4 && enemy.hp <= enemy.maxHP * (1 - enemy.phase / 4)) {
    enemy.phase++;
    announce(enemy, enemy.phase);
  }
  if (mid || final) updateBossHP(enemy);
  if (enemy.hp > 0) return;
  if (!mid && !final) drops.push({ x: enemy.x, y: enemy.y, kind: nextDrop() });
  score += final ? 5000 : 300;
  burst(enemy.x, enemy.y, final ? '#ffe4a4' : '#91f3cf', final ? 46 : 13);
  updateHUD();
  if (mid || final) awardShower(enemy, final);
}

function updateShots(dt) {
  for (const shot of shots) {
    shot.x += (shot.vx || 0) * dt;
    shot.y -= 660 * dt;
    const enemy = enemies.find(ship =>
      ship.hp > 0 && Math.hypot(ship.x - shot.x, ship.y - shot.y) < ship.radius + 5
    );
    if (!enemy) continue;
    shot.y = -30;
    damageEnemy(enemy, shot.damage || 1);
    if (warning || !enemies.length) break;
  }
  shots = shots.filter(shot => shot.y > -20);
  enemies = enemies.filter(enemy => enemy.hp > 0 && enemy.y < height + 35 && (enemy.kind !== 'crane' || enemy.age < 5));
}

function awardShower(enemy, final) {
  stage = final ? 'finalReward' : 'midReward';
  rewardTime = 0;
  bossPanel.hidden = true;
  enemies = []; bullets = []; shots = [];
  const count = final ? 48 : 32;
  for (let i = 0; i < count; i++) {
    const angle = i * 2.4;
    const speed = 55 + (i % 7) * 24;
    drops.push({ kind: 'coin', x: enemy.x, y: enemy.y, reward: true,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed + 72 });
  }
}

function updateHazards(dt) {
  for (const bullet of bullets) {
    bullet.angle += bullet.turn * dt;
    bullet.x += Math.cos(bullet.angle) * bullet.speed * dt;
    bullet.y += Math.sin(bullet.angle) * bullet.speed * dt;
    const radius = forms[bullet.form].radius;
    const distance = Math.hypot(bullet.x - player.x, bullet.y - player.y);
    if (player.invincible > 0) continue;
    if (distance < player.radius + radius) {
      takeHit();
      break;
    }
    if (distance < radius + 18 && !bullet.grazed) {
      bullet.grazed = true;
      graze++;
      score += 15;
      updateHUD();
    }
  }
  if (player.invincible <= 0 && enemies.some(enemy =>
    Math.hypot(enemy.x - player.x, enemy.y - player.y) < enemy.radius + player.radius
  )) takeHit();
  bullets = bullets.filter(bullet =>
    bullet.x > -16 && bullet.x < width + 16 && bullet.y > -16 && bullet.y < height + 16
  );
}

function takeHit() {
  player.life--;
  player.invincible = 1.65;
  bullets = bullets.filter(bullet => Math.hypot(bullet.x - player.x, bullet.y - player.y) > 125);
  burst(player.x, player.y, '#ffd5a3', 25);
  updateHUD();
  if (player.life === 0) setMode('over');
}

function update(dt) {
  age += dt;
  bombLeft = Math.max(0, bombLeft - dt);
  if (warning) {
    warning.left -= dt;
    if (warning.left <= 0) warning = null;
    return;
  }
  if (stage === 'approach' || stage === 'beacon') {
    routeTime += dt;
    scenery += dt;
    const waves = stage === 'approach' ? 13 : 17;
    if (nextWave < waves && routeTime >= 1 + nextWave * 4.8) {
      spawnWave(nextWave + (stage === 'beacon' ? 13 : 0));
      nextWave++;
    }
    if (routeTime >= waves * 4.8 + 8) {
      spawnBoss(stage === 'beacon');
      return;
    }
  }
  const rewarding = stage === 'finalReward' || stage === 'midReward';
  if (rewarding) rewardTime += dt;
  for (const item of drops) {
    if (item.reward && rewardTime < .95) {
      item.x = clamp(item.x + item.vx * dt, 12, width - 12);
      item.y = clamp(item.y + item.vy * dt, 22, height - 12);
      continue;
    }
    if (!item.reward) item.y += 89 * dt;
    const dx = player.x - item.x, dy = player.y - item.y;
    const distance = Math.hypot(dx, dy);
    if (distance < 72 || item.reward) {
      item.x += dx * 8 * dt;
      item.y += dy * 8 * dt;
    }
    if (distance < 18) {
      if (item.kind === 'power') power = Math.min(maxPower, power + 1);
      score += item.kind === 'coin' ? 500 : 80;
      burst(item.x, item.y, '#ffe681', 8);
      item.y = height + 40;
      updateHUD();
    }
  }
  drops = drops.filter(item => item.y < height + 24);
  updatePlayer(dt);
  if (rewarding) {
    shots = [];
    if (rewardTime > 1 && !drops.some(item => item.reward)) {
      if (stage === 'finalReward') setMode(chapterIndex === chapters.length - 1 ? 'clear' : 'intermission');
      else { stage = 'beacon'; routeTime = nextWave = 0; }
    }
    return;
  }
  updateEnemies(dt);
  if (stage === 'crossing' && enemies[0].phase === 2) {
    const mid = enemies[0];
    mid.sealLeft = Math.max(0, mid.sealLeft - dt);
    updateBossHP(mid);
    if (mid.sealLeft === 0) { awardShower(mid, false); return; }
  }
  updateShots(dt);
  if (bombLeft > 0) bullets = [];
  else if (mode === 'playing' && !warning) updateHazards(dt);
}

function drawBackground() {
  ctx.fillStyle = '#0b0e21';
  ctx.fillRect(0, 0, width, height);
  const river = artwork[chapter.map];
  if (!river) return;
  // Overlap the banks at the join so the river can scroll continuously.
  const overlap = 70;
  const stride = river.height - overlap;
  const offset = Math.floor((scenery * 21 + scrollTime * 4) % stride);
  for (let y = offset - 2 * stride; y < height; y += stride) {
    ctx.drawImage(river, 0, overlap, width, stride, 0, y + overlap, width, stride);
    for (let strip = 0; strip < overlap; strip += 5) {
      ctx.globalAlpha = (strip + 2.5) / overlap;
      ctx.drawImage(river, 0, strip, width, 5, 0, y + strip, width, 5);
    }
    ctx.globalAlpha = 1;
  }
}

function polygon(points, fill) {
  ctx.beginPath();
  points.forEach(([x,y], i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}

function oval(x, y, rx, ry, fill, rotation = 0) {
  ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rotation,0,tau);
  ctx.fillStyle = fill; ctx.fill();
}

function drawCharacter(name, x, y, size) {
  const image = artwork[name];
  if (!image) return;
  const scale = size / Math.max(image.width, image.height);
  const w = Math.round(image.width * scale);
  const h = Math.round(image.height * scale);
  ctx.drawImage(image, Math.round(x - w / 2), Math.round(y - h / 2), w, h);
}

function showSpell() {
  const {spell,left} = warning;
  const final = spell > 0;
  const slide = Math.min(1,(1.9-left)/.24);
  ctx.save();
  ctx.translate((1-slide)*width,0);
  polygon([[0,235],[520,193],[520,384],[0,426]],final ? '#35213cf2' : '#163647f2');
  polygon([[0,235],[520,193],[520,198],[0,240]],final ? '#eab072' : '#77dfcc');
  drawCharacter(final ? chapter.boss : chapter.mid, 105, 307, 224);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#e6d4ad'; ctx.font = '18px serif';
  ctx.fillText(chapter.names[final ? 1 : 0],210,273);
  ctx.fillStyle = '#fff5dc'; ctx.font = 'bold 31px serif';
  ctx.fillText(chapter.spells[spell],208,326,296);
  ctx.restore();
}

function draw() {
  drawBackground();
  for (const shot of shots) {
    const thickness = 2 + (shot.damage || 1) * 2;
    ctx.fillStyle = shot.damage > 1 ? '#ffdfa0' : '#8bf8d1';
    ctx.fillRect(shot.x - thickness / 2, shot.y - 10, thickness, 18);
  }
  for (const enemy of enemies) {
    if (enemy.kind === 'boss' || enemy.kind === 'mid') {
      ctx.strokeStyle = '#f8ce8780';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(enemy.x,enemy.y,49,36,enemy.age*.5,0,tau); ctx.stroke();
      const final = enemy.kind === 'boss';
      drawCharacter(final ? chapter.boss : chapter.mid, enemy.x, enemy.y, final ? 108 : 88);
    } else {
      if (enemy.age >= 0) drawCharacter(enemy.kind, enemy.x, enemy.y, spirits[enemy.kind].size);
    }
  }
  for (const item of drops) {
    drawCharacter(item.kind, item.x, item.y, item.kind === 'power' ? 26 : 21);
  }
  if (player.life > 0 && (player.invincible <= 0 || Math.floor(player.invincible * 13) % 2 === 0)) {
    for (let i=1;i<=Math.ceil(power / 3);i++) {
      for (const side of [-1,1]) {
        const x = player.x + side * (20 + i * 14);
        drawCharacter('cat', x, player.y + i * 4, 20);
      }
    }
    ctx.save();
    ctx.translate(player.x, player.y - 8);
    ctx.rotate(player.lean);
    if (player.flip) ctx.scale(-1, 1);
    drawCharacter(player.facing, 0, 0, 65);
    ctx.restore();
    oval(player.x, player.y, player.radius + 2, player.radius + 2, '#18334b');
    ctx.fillStyle = '#f5fff8';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, tau);
    ctx.fill();
  }
  for (const bullet of bullets) {
    const {radius,color} = forms[bullet.form];
    if (bullet.form === 'seal') {
      ctx.save(); ctx.translate(bullet.x, bullet.y); ctx.rotate(bullet.angle + Math.PI/2);
      drawCharacter('seal', 0, 0, 19);
      ctx.restore(); continue;
    } else if (bullet.form === 'seed') oval(bullet.x,bullet.y,7,3,color,bullet.angle);
    else if (bullet.form === 'star') {
      const points = [];
      for (let i=0;i<10;i++) {
        const angle=i*tau/10+age, r=i%2 ? 4 : 8;
        points.push([bullet.x+Math.cos(angle)*r,bullet.y+Math.sin(angle)*r]);
      }
      polygon(points,color);
    } else oval(bullet.x,bullet.y,radius+1,radius+1,color);
    oval(bullet.x,bullet.y,radius*.52,radius*.52,'#fff5e0');
  }
  for (const spark of sparks) {
    ctx.globalAlpha = spark.time * 2;
    ctx.fillStyle = spark.color;
    ctx.fillRect(spark.x, spark.y, 3, 3);
  }
  ctx.globalAlpha = 1;
  if (bombLeft > 0) {
    const progress = 1 - bombLeft / bombDuration;
    ctx.save();
    ctx.globalAlpha = .64 * (1 - progress);
    ctx.strokeStyle = '#b9fff5';
    ctx.lineWidth = 5;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath(); ctx.arc(player.x, player.y, 18 + (progress + i * .22) % 1 * 870, 0, tau); ctx.stroke();
    }
    ctx.fillStyle = '#bff9f5'; ctx.globalAlpha = .12 * (1-progress);
    ctx.fillRect(0,0,width,height);
    ctx.restore();
  }
  bombButton.disabled = !canBomb();
  if (warning) showSpell();
}

let previous = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - previous) / 1000);
  previous = now;
  if (mode !== 'paused') {
    scrollTime += dt;
    for (const spark of sparks) {
      spark.x += spark.vx * dt;
      spark.y += spark.vy * dt;
      spark.time -= dt;
    }
    sparks = sparks.filter(spark => spark.time > 0);
  }
  if (mode === 'playing') update(dt);
  draw();
  requestAnimationFrame(frame);
}

reset();
loadArtwork().catch(() => {
  description.textContent = '画像を読み込めませんでした。ページを再読み込みしてください。';
});
requestAnimationFrame(frame);
</script>
</body>
</html>
