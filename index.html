<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜光ビート</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#292747,#0b1020 70%);color:#edfff8;font:16px system-ui;min-height:100vh}main{width:min(92%,460px);margin:auto;padding:3vh 0}header,footer{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(28px,7vw,48px);margin:0;letter-spacing:.06em}p{color:#c4c5d9}#track{display:flex;position:relative;height:min(53vh,500px);overflow:hidden;border-radius:14px;background:linear-gradient(#13182d,#24243f)}#track:after{content:"";position:absolute;top:84%;height:2px;background:white;width:100%;pointer-events:none}.lane{position:relative;flex:1;background:transparent;border:0;border-right:1px solid #51516a;color:white;touch-action:manipulation}.lane span{position:absolute;bottom:3%;left:0;width:100%;font:bold 18px monospace}.note{position:absolute;left:8%;width:84%;height:9px;border-radius:5px;background:var(--ink);box-shadow:0 0 13px var(--ink);transform:translateY(-50%);pointer-events:none}.flash{background:#ffffff24}#play{border:0;border-radius:24px;background:#91f6cf;color:#102824;font-weight:bold;padding:12px 22px}footer{margin-top:15px}output{font: bold 18px monospace}
</style><main><header><h1>夜光ビート</h1><output id="score">0 pt</output></header><p>光が白い線に重なったら D・F・J・K、またはレーンをタップ。</p><div id="track"></div><footer><strong id="status">120 BPM · 32拍</strong><button id="play">スタート</button></footer></main>
<script>
const track=document.querySelector('#track'), score=document.querySelector('#score'), statusText=document.querySelector('#status'), play=document.querySelector('#play');
const keys=['d','f','j','k'], colors=['#81ffd0','#8ad7ff','#caa4ff','#ff9ecb'];
let ctx, notes=[], start=0, points=0, combo=0, active=false;
const lanes=keys.map((key,i)=>{
  const lane=document.createElement('button');
  lane.className='lane'; lane.style.setProperty('--ink',colors[i]);
  lane.innerHTML='<span>'+key.toUpperCase()+'</span>';
  lane.onpointerdown=()=>hit(i); track.append(lane); return lane;
});
function tone(time,freq,duration,volume,type){
  const osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.type=type; osc.frequency.value=freq; gain.gain.setValueAtTime(0.0001,time);
  gain.gain.exponentialRampToValueAtTime(volume,time+0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001,time+duration);
  osc.connect(gain).connect(ctx.destination); osc.start(time); osc.stop(time+duration);
}
function hit(i){
  if(!active)return;
  lanes[i].animate([{background:'#ffffff42'},{background:'transparent'}],140);
  const now=ctx.currentTime-start;
  const note=notes.find(n=>!n.done && n.i===i && Math.abs(now-n.t)<=0.16);
  if(!note)return;
  const perfect=Math.abs(now-note.t)<=0.075;
  note.done=true; note.el.remove(); combo++; points+=perfect?100:60;
  score.textContent=points+' pt'; statusText.textContent=(perfect?'Perfect':'Good')+' · '+combo+' コンボ';
}
document.addEventListener('keydown',e=>{const i=keys.indexOf(e.key.toLowerCase()); if(i>=0&&!e.repeat)hit(i)});
function frame(){
  const now=ctx.currentTime-start;
  for(const n of notes){
    if(n.done)continue;
    if(now>n.t+0.16){n.done=true;n.el.remove();combo=0;statusText.textContent='Miss';continue}
    n.el.style.top=(84+(now-n.t)*62)+'%';
  }
  if(now<16){requestAnimationFrame(frame);return}
  active=false;statusText.textContent='終了！ '+points+' / 3200 pt';play.hidden=false;play.textContent='もう一度';
}
play.onclick=async()=>{
  play.hidden=true;ctx??=new AudioContext();await ctx.resume();
  notes=[];points=combo=0;score.textContent='0 pt';statusText.textContent='準備…';
  start=ctx.currentTime+1.6;
  const pattern=[0,1,2,1,3,2,1,0,2,3,1,2,0,2,3,1];
  for(let beat=0;beat<32;beat++){
    const i=pattern[beat%16], t=beat/2, el=document.createElement('i');
    el.className='note';el.style.top='-10%';lanes[i].append(el);notes.push({i,t,el,done:false});
    tone(start+t,[261.63,329.63,392,523.25][i],0.32,0.12,'triangle');
    tone(start+t,beat%2?150:65,0.12,0.14,'sine');
    tone(start+t+0.25,2200,0.045,0.025,'square');
  }
  active=true;frame();
};
</script></html>
