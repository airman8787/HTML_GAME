<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09181b">
<title>潮目 / TIDELINE</title>
<style>
:root {
  color-scheme: dark;
  --ink: #e4f8ef;
  --muted: #a0beb8;
  --mint: #82f2c2;
  --line: #294746;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100dvh; display: grid; place-items: center;
  background: radial-gradient(ellipse at 50% 15%, #1b3736, #091518 70%);
  color: var(--ink);
}
main { width: min(94vw, 520px, calc(72dvh * .7222)); margin: 12px auto; }
header, footer, .hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
header { margin-bottom: 9px; }
h1 { font-size: clamp(16px, 4vw, 25px); margin: 0; letter-spacing: .09em; }
h1 span { color: var(--muted); font-size: .52em; letter-spacing: .18em; }
button {
  font: inherit; cursor: pointer; border: 1px solid var(--line); border-radius: 4px;
  padding: 6px 10px; background: #142a2b; color: var(--ink); touch-action: manipulation;
}
button:disabled { opacity: .45; cursor: default; }
button:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
.hud {
  font-size: clamp(10px, 2.6vw, 13px); padding: 8px 10px; color: var(--muted);
  border: 1px solid var(--line); background: #102124; border-radius: 5px 5px 0 0;
}
.hud b { color: var(--ink); }
.field { position: relative; border: 1px solid var(--line); border-top: 0; background: #0a2026; }
canvas { display: block; width: 100%; aspect-ratio: 13 / 18; touch-action: none; }
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center;
  padding: 14px; background: #05161960; text-align: center;
}
.overlay[hidden], [hidden] { display: none !important; }
.card {
  width: min(100%, 310px); padding: clamp(12px, 4vw, 25px);
  background: #102326f5; border: 1px solid #49746c; border-radius: 8px;
  box-shadow: 0 16px 50px #0006;
}
h2 { margin: 0; font-size: clamp(19px, 5.8vw, 36px); }
.card p { color: var(--muted); font-size: 12px; line-height: 1.65; margin: 9px 0 16px; }
#action { width: 100%; font-weight: bold; background: var(--mint); color: #0a2322; padding: 9px; }
.boss { position: absolute; inset: 8px 12px auto; pointer-events: none; font-size: 10px; color: #ffd5b9; }
progress { width: 100%; height: 5px; accent-color: #ffb889; display: block; margin-top: 3px; }
footer { margin-top: 8px; font-size: 11px; line-height: 1.5; color: var(--muted); }
#touch-help { display: none; }
@media (pointer: coarse) {
  #key-help { display: none; }
  #touch-help { display: inline; }
}
@media (max-height: 530px) and (orientation: landscape) {
  main { width: min(48vw, calc(70dvh * .7222)); }
  .card p { margin: 3px 0 7px; font-size: 10px; }
  .card { padding: 7px; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>潮目 <span>TIDELINE</span></h1>
    <button id="pause" type="button" disabled aria-keyshortcuts="Escape P">一時停止</button>
  </header>
  <div class="hud">
    <span>SCORE <b id="score">000000</b></span>
    <span>LIFE <b id="life">3</b></span>
    <span>GRAZE <b id="graze">0</b></span>
  </div>
  <div class="field">
    <canvas id="game" width="520" height="720" aria-label="縦スクロールシューティングのプレイ画面"></canvas>
    <div id="boss" class="boss" hidden>ボス <progress id="boss-hp" aria-label="ボスの耐久力" value="1" max="1"></progress></div>
    <section id="overlay" class="overlay" aria-labelledby="heading">
      <div class="card">
        <h2 id="heading">潮目</h2>
        <p id="description">雲海を抜け、弾幕の先に待つボスを撃破せよ。</p>
        <button id="action" type="button">出撃</button>
      </div>
    </section>
  </div>
  <footer>
    <span id="key-help">矢印 / WASD 移動 · Z / Space 射撃 · Shift 低速</span>
    <span id="touch-help">ドラッグで移動 · 射撃は自動</span>
  </footer>
</main>
<script>
'use strict';

const canvas = document.querySelector('#game');
const ctx = canvas.getContext('2d');
const width = 520;
const height = 720;
const tau = Math.PI * 2;
const scoreLabel = document.querySelector('#score');
const lifeLabel = document.querySelector('#life');
const grazeLabel = document.querySelector('#graze');
const bossPanel = document.querySelector('#boss');
const bossHP = document.querySelector('#boss-hp');
const overlay = document.querySelector('#overlay');
const heading = document.querySelector('#heading');
const description = document.querySelector('#description');
const action = document.querySelector('#action');
const pause = document.querySelector('#pause');

const keys = new Set();
const movement = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyW', 'KeyA', 'KeyS', 'KeyD']);
const firing = new Set(['KeyZ', 'Space']);
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const stars = Array.from({ length: 94 }, (_, i) => ({
  x: (i * 197.83) % width,
  y: (i * 109.31) % height,
  speed: 24 + (i % 5) * 16,
  size: i % 11 === 0 ? 2 : 1
}));
const sky = ctx.createLinearGradient(0, 0, 0, height);
sky.addColorStop(0, '#0b242c');
sky.addColorStop(.64, '#112c34');
sky.addColorStop(1, '#091a22');

let mode = 'title';
let player, enemies, bullets, shots, sparks;
let score, graze, age, nextWave, bossSpawned, nextShot;
let scrollTime = 0;
let pointer = null;
let touchMode = false;

function reset() {
  player = { x: width / 2, y: height - 88, radius: 4, life: 3, invincible: 0 };
  enemies = [];
  bullets = [];
  shots = [];
  sparks = [];
  score = graze = age = nextWave = nextShot = 0;
  bossSpawned = false;
  bossPanel.hidden = true;
  keys.clear();
  pointer = null;
  touchMode = matchMedia('(pointer: coarse)').matches;
  updateHUD();
}

function updateHUD() {
  scoreLabel.textContent = String(score).padStart(6, '0');
  lifeLabel.textContent = player.life;
  grazeLabel.textContent = graze;
}

function setMode(next) {
  mode = next;
  overlay.hidden = mode === 'playing';
  pause.disabled = mode !== 'playing' && mode !== 'paused';
  pause.textContent = mode === 'paused' ? '再開' : '一時停止';
  keys.clear();
  pointer = null;
  if (mode === 'playing' && document.activeElement instanceof HTMLButtonElement) document.activeElement.blur();

  const messages = {
    paused: ['一時停止', 'ここから再開できます。', '再開'],
    clear: ['ステージクリア', 'スコア ' + score + ' · グレイズ ' + graze, 'もう一度'],
    over: ['ゲームオーバー', 'スコア ' + score + ' · グレイズ ' + graze, 'もう一度']
  };
  if (messages[mode]) {
    [heading.textContent, description.textContent, action.textContent] = messages[mode];
    action.focus();
  }
}

function togglePause() {
  if (mode === 'playing') setMode('paused');
  else if (mode === 'paused') setMode('playing');
}

action.addEventListener('click', () => {
  if (mode !== 'paused') reset();
  setMode('playing');
});
pause.addEventListener('click', togglePause);

document.addEventListener('keydown', event => {
  if (event.code === 'Escape' || event.code === 'KeyP') {
    if (!event.repeat) togglePause();
    return;
  }
  if (mode !== 'playing') return;
  if (event.target instanceof HTMLButtonElement && event.code === 'Space') return;
  if (!movement.has(event.code) && !firing.has(event.code) && !event.code.startsWith('Shift')) return;
  event.preventDefault();
  keys.add(event.code);
});
document.addEventListener('keyup', event => keys.delete(event.code));
window.addEventListener('blur', () => {
  if (mode === 'playing') setMode('paused');
});

canvas.addEventListener('pointerdown', event => {
  if (mode !== 'playing' || pointer) return;
  event.preventDefault();
  touchMode = true;
  canvas.setPointerCapture(event.pointerId);
  pointer = { id: event.pointerId, x: event.clientX, y: event.clientY };
});
canvas.addEventListener('pointermove', event => {
  if (pointer?.id !== event.pointerId) return;
  const rect = canvas.getBoundingClientRect();
  player.x = clamp(player.x + (event.clientX - pointer.x) * width / rect.width, 16, width - 16);
  player.y = clamp(player.y + (event.clientY - pointer.y) * height / rect.height, 25, height - 20);
  pointer.x = event.clientX;
  pointer.y = event.clientY;
});
for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  canvas.addEventListener(type, event => {
    if (pointer?.id === event.pointerId) pointer = null;
  });
}

function emit(enemy, angle, speed, color) {
  bullets.push({
    x: enemy.x, y: enemy.y + 12, vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed, color, grazed: false
  });
}

function volley(enemy) {
  const aim = Math.atan2(player.y - enemy.y - 12, player.x - enemy.x);
  if (enemy.kind === 'boss') {
    const secondPhase = enemy.hp <= enemy.maxHP / 2;
    const count = secondPhase ? 22 : 16;
    for (let i = 0; i < count; i++) {
      emit(enemy, i * tau / count + enemy.volley * .24, secondPhase ? 153 : 117, '#ffb180');
    }
    for (let i = -2; i <= 2; i++) {
      emit(enemy, aim + i * .14, secondPhase ? 210 : 170, '#e49afc');
    }
    enemy.cooldown = secondPhase ? .46 : .72;
  } else {
    const spread = enemy.kind === 'spinner' ? 2 : 1;
    for (let i = -spread; i <= spread; i++) {
      emit(enemy, aim + i * .23, enemy.kind === 'spinner' ? 155 : 128, '#ffb180');
    }
    enemy.cooldown = enemy.kind === 'spinner' ? 1.55 : 1.85;
  }
  enemy.volley++;
}

function spawnWave(index) {
  const spinner = index % 3 === 2;
  const side = index % 2 === 0 ? -1 : 1;
  for (let i = 0; i < 3; i++) {
    const x = 118 + 142 * i + 30 * side;
    enemies.push({
      kind: spinner ? 'spinner' : 'scout', x, baseX: x, y: -28 - 52 * i, side,
      radius: spinner ? 18 : 14, hp: spinner ? 5 : 3,
      cooldown: .95 + i * .18, age: 0, volley: 0
    });
  }
}

function spawnBoss() {
  bossSpawned = true;
  const hp = 440;
  enemies.push({
    kind: 'boss', x: width / 2, y: -70, radius: 45,
    hp, maxHP: hp, cooldown: 1.8, volley: 0, age: 0
  });
  bossPanel.hidden = false;
  bossHP.value = 1;
}

function burst(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = i * tau / count + Math.random() * .4;
    const speed = 34 + Math.random() * 145;
    sparks.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, time: .5, color });
  }
}

function updatePlayer(dt) {
  const dx = Number(keys.has('ArrowRight') || keys.has('KeyD')) - Number(keys.has('ArrowLeft') || keys.has('KeyA'));
  const dy = Number(keys.has('ArrowDown') || keys.has('KeyS')) - Number(keys.has('ArrowUp') || keys.has('KeyW'));
  const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 145 : 325) * dt / (Math.hypot(dx, dy) || 1);
  player.x = clamp(player.x + dx * speed, 16, width - 16);
  player.y = clamp(player.y + dy * speed, 25, height - 20);
  player.invincible = Math.max(0, player.invincible - dt);

  if ((touchMode || keys.has('KeyZ') || keys.has('Space')) && age >= nextShot) {
    for (const offset of [-10, 10]) shots.push({ x: player.x + offset, y: player.y - 15 });
    nextShot = age + .105;
  }
}

function updateEnemies(dt) {
  for (const enemy of enemies) {
    enemy.age += dt;
    if (enemy.kind === 'boss') {
      enemy.y = Math.min(133, enemy.y + 106 * dt);
      enemy.x = width / 2 + Math.sin(Math.max(0, enemy.age - 1.9) * .75) * 96;
    } else {
      enemy.y += (enemy.kind === 'spinner' ? 66 : 87) * dt;
      enemy.x = enemy.baseX + Math.sin(enemy.age * 1.72) * 46 * enemy.side;
    }
    if (enemy.y > 20) {
      enemy.cooldown -= dt;
      if (enemy.cooldown <= 0) volley(enemy);
    }
  }
}

function updateShots(dt) {
  for (const shot of shots) {
    shot.y -= 660 * dt;
    const enemy = enemies.find(ship =>
      ship.hp > 0 && Math.hypot(ship.x - shot.x, ship.y - shot.y) < ship.radius + 5
    );
    if (!enemy) continue;
    enemy.hp--;
    shot.y = -30;
    if (enemy.kind === 'boss') bossHP.value = enemy.hp / enemy.maxHP;
    if (enemy.hp > 0) continue;

    const final = enemy.kind === 'boss';
    score += final ? 5000 : 300;
    burst(enemy.x, enemy.y, final ? '#ffe4a4' : '#91f3cf', final ? 46 : 13);
    updateHUD();
    if (final) {
      bossPanel.hidden = true;
      bullets = [];
      setMode('clear');
      break;
    }
  }
  shots = shots.filter(shot => shot.y > -20);
  enemies = enemies.filter(enemy => enemy.hp > 0 && enemy.y < height + 35);
}

function updateHazards(dt) {
  for (const bullet of bullets) {
    bullet.x += bullet.vx * dt;
    bullet.y += bullet.vy * dt;
    const distance = Math.hypot(bullet.x - player.x, bullet.y - player.y);
    if (player.invincible > 0) continue;
    if (distance < player.radius + 4) {
      takeHit();
      break;
    }
    if (distance < 22 && !bullet.grazed) {
      bullet.grazed = true;
      graze++;
      score += 15;
      updateHUD();
    }
  }
  if (player.invincible <= 0 && enemies.some(enemy =>
    Math.hypot(enemy.x - player.x, enemy.y - player.y) < enemy.radius + player.radius
  )) takeHit();
  bullets = bullets.filter(bullet =>
    bullet.x > -16 && bullet.x < width + 16 && bullet.y > -16 && bullet.y < height + 16
  );
}

function takeHit() {
  player.life--;
  player.invincible = 1.65;
  bullets = bullets.filter(bullet => Math.hypot(bullet.x - player.x, bullet.y - player.y) > 125);
  burst(player.x, player.y, '#ffd5a3', 25);
  updateHUD();
  if (player.life === 0) setMode('over');
}

function update(dt) {
  age += dt;
  if (nextWave < 8 && age >= 1 + nextWave * 3) spawnWave(nextWave++);
  if (age >= 29 && !bossSpawned) spawnBoss();
  updatePlayer(dt);
  updateEnemies(dt);
  updateShots(dt);
  if (mode === 'playing') updateHazards(dt);
}

function drawBackground() {
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = '#8cdacb';
  for (const star of stars) {
    const y = (star.y + scrollTime * star.speed) % height;
    ctx.globalAlpha = star.size === 2 ? .49 : .25;
    ctx.fillRect(star.x, y, star.size, star.size * 3);
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#8cdacb20';
  ctx.lineWidth = 1;
  for (let x = 44; x < width; x += 72) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
    ctx.stroke();
  }
  const orbit = (scrollTime * 40) % 420;
  for (let y = orbit - 420; y < height + 120; y += 210) {
    ctx.beginPath();
    ctx.ellipse(width / 2, y, 226, 49, 0, 0, tau);
    ctx.stroke();
  }
}

function drawShip(x, y, scale, angle, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);
  ctx.fillStyle = '#12282f';
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(0, -22);
  ctx.lineTo(8, -7);
  ctx.lineTo(19, 11);
  ctx.lineTo(9, 8);
  ctx.lineTo(0, 15);
  ctx.lineTo(-9, 8);
  ctx.lineTo(-19, 11);
  ctx.lineTo(-8, -7);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.fillRect(-1.5, -8, 3, 10);
  ctx.restore();
}

function draw() {
  drawBackground();
  for (const shot of shots) {
    ctx.fillStyle = '#8bf8d1';
    ctx.fillRect(shot.x - 2, shot.y - 10, 4, 18);
  }
  for (const enemy of enemies) {
    const boss = enemy.kind === 'boss';
    if (boss) {
      ctx.strokeStyle = '#ffb88777';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(enemy.x, enemy.y, 66, 29, enemy.age * .75, 0, tau);
      ctx.stroke();
    }
    drawShip(enemy.x, enemy.y, boss ? 2.45 : 1, Math.PI, boss ? '#ffd19a' : '#efa780');
  }
  for (const bullet of bullets) {
    ctx.fillStyle = bullet.color;
    ctx.beginPath();
    ctx.arc(bullet.x, bullet.y, 4.5, 0, tau);
    ctx.fill();
    ctx.fillStyle = '#fff0db';
    ctx.fillRect(bullet.x - 1, bullet.y - 1, 2, 2);
  }
  if (player.life > 0 && (player.invincible <= 0 || Math.floor(player.invincible * 13) % 2 === 0)) {
    drawShip(player.x, player.y, 1, 0, '#83f8d1');
    ctx.fillStyle = '#f5fff8';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, tau);
    ctx.fill();
  }
  for (const spark of sparks) {
    ctx.globalAlpha = spark.time * 2;
    ctx.fillStyle = spark.color;
    ctx.fillRect(spark.x, spark.y, 3, 3);
  }
  ctx.globalAlpha = 1;
}

let previous = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - previous) / 1000);
  previous = now;
  if (mode !== 'paused') {
    scrollTime += dt;
    for (const spark of sparks) {
      spark.x += spark.vx * dt;
      spark.y += spark.vy * dt;
      spark.time -= dt;
    }
    sparks = sparks.filter(spark => spark.time > 0);
  }
  if (mode === 'playing') update(dt);
  draw();
  requestAnimationFrame(frame);
}

reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
